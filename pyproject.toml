[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-pipeline-sms-alerts"
version = "0.1.0"
description = "Typed media processing events with transactional creator SMS delivery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
